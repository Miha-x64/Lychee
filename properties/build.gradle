
apply plugin: 'kotlin'
//apply plugin: 'jacoco'

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "com.github.Miha-x64.Kotlin-MPP_Collection_utils:Collection-utils-jvm:$collection_utils_version"
    compileOnly projects.etc.fakeBindings
    compileOnly projects.persistence // ManagedProperty uses FieldDef from :persistence
    compileOnly 'androidx.annotation:annotation:1.2.0'

    testImplementation "junit:junit:$junit_version"
    testImplementation projects.persistence
    testImplementation projects.etc.testing
}

/*jacocoTestReport {
    reports {
        xml.enabled true
        html.enabled false
    }
}*/
tasks.test {
    maxParallelForks = Integer.min(Runtime.getRuntime().availableProcessors(), 4)
//  finalizedBy jacocoTestReport
}

ext {
    PUBLISH_GROUP_ID = 'su.lychee'
    PUBLISH_ARTIFACT_ID = 'properties'
    PUBLISH_NAME = 'Lychee Properties'
    PUBLISH_DESCRIPTION = 'Lightweight observable properties'
}
apply from: rootProject.file('etc/publish-module.gradle')
