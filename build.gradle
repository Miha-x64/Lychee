buildscript {
    ext.kotlin_version = '2.3.10'
    ext.okio_version = '3.4.0'
    ext.support_version = '28.0.0'
    ext.splitties_version = '3.0.0'
    ext.android_artifact_version = '4.4.2_r2'
    ext.target_android_version = 36
    ext.collection_utils_version = '1.0-alpha05'
    ext.sqlite_jdbc_version = '3.41.2.2'
    ext.junit_version = '4.13.2'
    ext.gson_version = '2.13.2'
    ext.PUBLISH_VERSION = '0.0.18'

    repositories {
        mavenCentral()
        google()
        maven { url = "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        classpath 'com.android.tools.build:gradle:8.12.3'

        classpath 'org.jetbrains.dokka:dokka-gradle-plugin:2.1.0'
        classpath 'io.github.gradle-nexus:publish-plugin:2.0.0'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
    }
}

apply plugin: 'io.github.gradle-nexus.publish-plugin'
apply from: "etc/publish-root.gradle"

allprojects {
    repositories {
        mavenCentral()
        google()
        // that's where KitKat Android.jar is stored:
        maven { url = 'https://philanthropist.touk.pl/nexus/content/repositories/releases/' }
        // net.aquadc.collections:Collection-utils are here. There's also com.github.grishka's LiteX in Android sample
        maven { url = 'https://jitpack.io' }
    }

    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '1.8'
        }
    }
    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

    }
}
